name: CI

# Every job here runs against a fresh checkout, which is the point: the
# repository once carried an unanchored `data/` ignore rule that excluded
# src/data/ and server/data/ as collateral, so the committed tree did not
# type-check even though the developer's working copy did. Only a clean
# checkout catches that class of bug.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      # Drift gate: src/i18n/dictionaries/{en,ar}.ts are generated from
      # src/i18n/translations.ts — this fails if they are stale (per
      # scripts/i18n/emitDictionaries.ts:71).
      - name: i18n dictionary drift gate
        run: npx tsx scripts/i18n/emitDictionaries.ts

      # The suite swaps the Database singleton onto an in-memory adapter in
      # tests/setup.ts and installs an fs tripwire, so it never touches
      # data/dahab_db.json. Baseline to hold: 19 files, 257 tests.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The seed datasets are read at boot, and importDahabLocalCommerce()
      # throws when dahab_local_commerce.json is missing. Asserting on the
      # files directly turns "the container will not start" into a failed
      # step with an obvious cause.
      - name: Verify boot-critical seed data is present
        run: |
          set -e
          for f in data/dahab_local_commerce.json data/instagram/dahab_instagram_sources.json data/dahab_hotels.json data/dahab_rentals.json; do
            test -s "$f" || { echo "::error file=$f::missing or empty; the server cannot boot without it"; exit 1; }
          done
          echo "Seed datasets present."

      # Guards the reverse mistake: runtime state carries live session tokens,
      # traveler contact details and supplier payout IBANs, and must never be
      # committed.
      # Note: VOLUME is not durable on Cloud Run — container filesystems are
      # ephemeral there, so /app/data must be backed by a durable mount
      # (e.g. Filestore NFS) or the store is disposable. Keep this comment
      # even if the mount is configured elsewhere.
      - name: Verify runtime state is not committed
        run: |
          set -e
          leaked=$(git ls-files -- 'data/dahab_db.json' 'data/locks/*' 'data/*.seq' '.env' || true)
          if [ -n "$leaked" ]; then
            echo "::error::runtime state or secrets are tracked:"; echo "$leaked"; exit 1
          fi
          echo "No runtime state tracked."

      - name: Report client bundle sizes
        if: always()
        run: |
          echo "### Client bundle" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -lhS dist/assets/*.js dist/assets/*.css 2>/dev/null | awk '{print $5, $9}' | head -15 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
