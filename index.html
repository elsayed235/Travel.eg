    <meta name="theme-color" content="#081714" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / social. Canonical + og:url are stamped per-route by the
         server (metaInjection) and by the pre-hydration script below using
         the real origin; the static fallback keeps relative hrefs valid. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DAHAB" />
    <meta property="og:title" content="DAHAB — Your Dahab trip, built around you" />
    <meta property="og:description" content="Personalized Dahab planning, local experiences, and authentic Sinai adventures — built with the people who live here." />
    <meta property="og:image" content="/images/hero/coral-reef-split.jpg" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ar_EG" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DAHAB — Your Dahab trip, built around you" />
    <meta name="twitter:description" content="Personalized Dahab planning, local experiences, and authentic Sinai adventures." />
    <meta name="twitter:image" content="/images/hero/coral-reef-split.jpg" />

    <link rel="canonical" href="/" />
    <link rel="alternate" hreflang="en" href="/" />
    <link rel="alternate" hreflang="ar" href="/?lang=ar" />
    <link rel="alternate" hreflang="x-default" href="/" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300..700&family=Chakra+Petch:wght@500;600;700&family=El+Messiri:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@300..800&display=swap" rel="stylesheet" />

    <script>
      /*
       * Pre-hydration language/theme application.
       *
       * LanguageContext.applyLanguageAttributes only runs after React mounts,
       * so an Arabic visitor's first paint was `lang="en" dir="ltr"` — wrong
       * font stack (Latin), wrong direction, visible layout shift when the
       * rtl attribute landed. This repeats the *reading* of the persisted
       * choice (the same storage key), not the decision: LanguageContext
       * remains the single source of truth and overwrites these attributes
       * on mount.
       */
      (function () {
        try {
          var lang = localStorage.getItem('dahab_os_lang');
          if (lang !== 'ar' && lang !== 'en') {
            lang = (navigator.language || '').toLowerCase().indexOf('ar') === 0 ? 'ar' : 'en';
          }
          var root = document.documentElement;
          root.lang = lang;
          root.dir = lang === 'ar' ? 'rtl' : 'ltr';
          root.classList.remove('rtl', 'ltr');
          root.classList.add(lang === 'ar' ? 'rtl' : 'ltr');
          var canonical = document.querySelector('link[rel="canonical"]');
          var origin = location.origin;
          if (canonical && origin.indexOf('http') === 0) {
            canonical.setAttribute('href', origin + '/');
          }
        } catch (e) {
          /* storage can throw in private windows; defaults above already hold */
        }
      })();
    </script>
  </head>
  <body class="bg-[#070D1F] text-[#F7F3EA] antialiased selection:bg-[#E8A33D]/30 selection:text-[#F7F3EA] min-h-screen">
