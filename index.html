<!doctype html>
<html lang="en" class="dark" data-theme="dark" data-theme-id="abyss">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: the app draws edge to edge on notched phones and in
         the native shell; chrome pads itself with env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DAHAB" />
    <meta name="format-detection" content="telephone=no" />
    <title>DAHAB — Your Dahab trip, built around you</title>
    <meta name="description" content="A premium digital travel platform for Dahab, Egypt. Personalized planning, local experiences, and authentic adventures." />
    <meta name="theme-color" content="#0B151C" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / social. Canonical + og:url are stamped per-route by the
         server (metaInjection) and by the pre-hydration script below using
         the real origin; the static fallback keeps relative hrefs valid. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DAHAB" />
    <meta property="og:title" content="DAHAB — Your Dahab trip, built around you" />
    <meta property="og:description" content="Personalized Dahab planning, local experiences, and authentic Sinai adventures — built with the people who live here." />
    <meta property="og:image" content="/images/hero/coral-reef-split.jpg" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ar_EG" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DAHAB — Your Dahab trip, built around you" />
    <meta name="twitter:description" content="Personalized Dahab planning, local experiences, and authentic Sinai adventures." />
    <meta name="twitter:image" content="/images/hero/coral-reef-split.jpg" />

    <link rel="canonical" href="/" />
    <link rel="alternate" hreflang="en" href="/" />
    <link rel="alternate" hreflang="ar" href="/?lang=ar" />
    <link rel="alternate" hreflang="x-default" href="/" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Granite & Lagoon type (src/styles/tokens.css): Fraunces (Latin display),
         Alexandria (Arabic display), IBM Plex Sans + Plex Sans Arabic (UI),
         Plex Mono (readings). Weights are the ones the system uses, no more. -->
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700&family=Fraunces:opsz,wght,SOFT@9..144,400..600,100&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />

    <script>
      /*
       * Pre-hydration language/theme application.
       *
       * LanguageContext.applyLanguageAttributes only runs after React mounts,
       * so an Arabic visitor's first paint was `lang="en" dir="ltr"` — wrong
       * font stack (Latin), wrong direction, visible layout shift when the
       * rtl attribute landed. This repeats the *reading* of the persisted
       * choice (the same storage key), not the decision: LanguageContext
       * remains the single source of truth and overwrites these attributes
       * on mount.
       */
      (function () {
        try {
          var lang = localStorage.getItem('dahab_os_lang');
          if (lang !== 'ar' && lang !== 'en') {
            lang = (navigator.language || '').toLowerCase().indexOf('ar') === 0 ? 'ar' : 'en';
          }
          var root = document.documentElement;
          root.lang = lang;
          root.dir = lang === 'ar' ? 'rtl' : 'ltr';
          root.classList.remove('rtl', 'ltr');
          root.classList.add(lang === 'ar' ? 'rtl' : 'ltr');
          // Theme before first paint (ThemeContext stays the source of truth
          // and re-applies on mount). Legacy six-theme ids fold into the two
          // Granite & Lagoon themes.
          var tid = localStorage.getItem('dahab_travel_os_theme_id');
          var light = { 'salt': 1, 'editorial-sand': 1, 'lagoon-breeze': 1 };
          var theme = tid === 'high-contrast-pro' ? 'high-contrast-pro' : (tid && light[tid] ? 'salt' : 'abyss');
          root.setAttribute('data-theme-id', theme);
          root.setAttribute('data-theme', theme === 'salt' ? 'light' : 'dark');
          root.classList.toggle('dark', theme !== 'salt');
          root.classList.toggle('light', theme === 'salt');
          var canonical = document.querySelector('link[rel="canonical"]');
          var origin = location.origin;
          if (canonical && origin.indexOf('http') === 0) {
            canonical.setAttribute('href', origin + '/');
          }
        } catch (e) {
          /* storage can throw in private windows; defaults above already hold */
        }
      })();
    </script>
  </head>
  <body class="antialiased">
    <!-- Design direction: Granite & Lagoon — docs/premium-plan/DAHAB_PREMIUM_PLAN.html §06. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
